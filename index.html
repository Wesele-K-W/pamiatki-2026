<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta property="og:description" content="Podziel się z nami swoimi zdjęciami i filmami z wesela! Każda chwila jest dla nas bezcenną pamiątką 📸">
  <meta property="og:image" content="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48d/512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wesele-k-w.github.io/pamiatki-2026/">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zdjęcia z Naszego Wesela 💍">
  <meta name="twitter:description" content="Podziel się z nami swoimi zdjęciami i filmami z wesela! 📸">
  <meta name="twitter:image" content="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48d/512.png">

  <!-- Favicon - ślubna obrączka w przeglądarce -->
  <link rel="icon" type="image/png" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48d/512.png">
  <link rel="shortcut icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48d/512.png">
  <link rel="apple-touch-icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f48d/512.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fdfbf7">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
      position: fixed; /* Zapobiega niepożądanemu przewijaniu tła na iPhone/Android */
    }

    /* Ramka z aplikacją z ujemnym marginesem ukrywającym szary baner Google */
    .app-frame {
      position: absolute;
      top: -45px; /* Wypycha szary pasek Google Apps Script poza ekran */
      left: 0;
      width: 100%;
      height: calc(100% + 45px); /* Rozszerza widok o ucięty margines */
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Ramka ładująca aplikację weselną z Google Apps Script -->
  <iframe 
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbz7dG2iEGJGkXx_yrMr3F6KkSgFIL9tXt_elhF0QDvHia-W3DjzruyasFTYzdbhF9HrjQ/exec"
    allow="camera; microphone; clipboard-write"
    allowfullscreen>
  </iframe>
</body>
</html>
